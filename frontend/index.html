<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bastion</title>
  <link rel="icon" href="/__dash/favicon.svg">
  <link rel="stylesheet" href="/__dash/app.css">
  <link rel="stylesheet" href="/__dash/pages/overview.css">
  <link rel="stylesheet" href="/__dash/pages/incidents.css">
  <link rel="stylesheet" href="/__dash/pages/investigator.css">
  <link rel="stylesheet" href="/__dash/pages/attacker.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="bg-grid"></span><span class="bg-glow"></span></div>

  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M12 2.5 19.5 5.2V11c0 5-3.2 8.3-7.5 10.3C7.7 19.3 4.5 16 4.5 11V5.2z"/>
            <path d="M12 7.3v9.4" stroke-width="1.4"/>
          </svg>
        </span>
        <span class="brand-word">Bastion</span>
      </div>

      <nav class="nav" aria-label="Views">
        <a class="nav-item" data-route="/" href="#/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Overview</span>
        </a>
        <a class="nav-item" data-route="/incidents" href="#/incidents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span>Incidents</span>
        </a>
        <a class="nav-item" data-route="/investigator" href="#/investigator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>
          <span>Investigator</span>
        </a>
        <a class="nav-item" data-route="/attacker" href="#/attacker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14a5 5 0 1 1 8 0"/><path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1z"/><circle cx="12" cy="9" r="1"/></svg>
          <span>Attacker</span>
        </a>
      </nav>

    </aside>

    <main class="main">
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- Shared incident detail drawer -->
  <div class="scrim" data-scrim hidden></div>
  <aside class="drawer" data-drawer role="dialog" aria-modal="true" aria-hidden="true" aria-label="Incident detail">
    <div class="drawer-head">
      <div class="drawer-title">
        <span class="sev" data-d="sev"></span>
        <h2 data-d="type">Incident</h2>
      </div>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" data-drawer-body></div>
  </aside>

  <script type="module" src="/__dash/app.js"></script>
</body>
</html>
