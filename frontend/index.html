<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bastion</title>
  <link rel="icon" type="image/png" href="/__dash/favicon.png">
  <link rel="stylesheet" href="/__dash/app.css">
  <link rel="stylesheet" href="/__dash/pages/overview.css">
  <link rel="stylesheet" href="/__dash/pages/incidents.css">
  <link rel="stylesheet" href="/__dash/pages/investigator.css">
  <link rel="stylesheet" href="/__dash/pages/attacker.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="#/">
        <img class="brand-mark" src="/__dash/assets/logo.png" alt="" width="22" height="22" decoding="async">
        <span class="brand-word">Bastion</span>
      </a>
      <nav class="nav" aria-label="Views">
        <a class="nav-item" data-route="/" href="#/">Overview</a>
        <a class="nav-item" data-route="/incidents" href="#/incidents">Incidents</a>
        <a class="nav-item" data-route="/investigator" href="#/investigator">Agent</a>
        <a class="nav-item" data-route="/attacker" href="#/attacker">Attacker</a>
      </nav>
      <span class="feed" data-feed hidden role="status">Live feed lost. Reconnecting</span>
    </header>

    <main class="main">
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- Shared incident detail drawer -->
  <div class="scrim" data-scrim hidden></div>
  <aside class="drawer" data-drawer role="dialog" aria-modal="true" aria-hidden="true" aria-label="Incident detail">
    <div class="drawer-head">
      <div class="drawer-title">
        <span class="sev" data-d="sev"></span>
        <h2 data-d="type">Incident</h2>
      </div>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" data-drawer-body></div>
  </aside>

  <script type="module" src="/__dash/app.js"></script>
</body>
</html>
