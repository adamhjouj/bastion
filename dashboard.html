<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breach Agent SOC</title>
<style>
  :root { --bg:#0a0e14; --panel:#121823; --line:#1e2733; --txt:#c7d1dd;
          --dim:#6b7888; --red:#ff4d5e; --grn:#3ddc84; --amb:#ffb020; --cyan:#35d0d8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:16px; padding:12px 18px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header .live { color:var(--grn); font-size:11px; }
  header .live::before { content:"● "; }
  .stats { margin-left:auto; display:flex; gap:22px; }
  .stat { text-align:right; } .stat b { display:block; font-size:20px; }
  .stat.red b{color:var(--red)} .stat.amb b{color:var(--amb)} .stat.cyan b{color:var(--cyan)}
  .stat span { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  main { display:grid; grid-template-columns:1.3fr 1fr; gap:14px; padding:14px; height:calc(100vh - 58px); }
  .col { display:flex; flex-direction:column; gap:14px; min-height:0; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px;
         display:flex; flex-direction:column; min-height:0; }
  .box h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
            margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  .box .body { overflow-y:auto; padding:6px 0; }
  .feed { flex:2; } .incidents { flex:1.4; } .defenses { flex:1; }
  .row { padding:3px 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .code { color:var(--dim); }
  .row.attack { background:rgba(255,77,94,.08); color:#ffd2d7; }
  .row.blocked { background:rgba(61,220,132,.07); }
  .tag { display:inline-block; font-size:10px; padding:0 5px; border-radius:3px; margin-right:6px; }
  .tag.b200{background:#1c3a2a;color:var(--grn)} .tag.b403{background:#3a1c22;color:var(--red)}
  .tag.b302,.tag.b500,.tag.b502{background:#3a331c;color:var(--amb)}
  .inc { padding:9px 14px; border-bottom:1px solid var(--line); }
  .inc .t { color:var(--red); font-weight:bold; }
  .inc .t .sev { font-size:10px; background:var(--red); color:#000; padding:0 5px; border-radius:3px; margin-right:6px; }
  .inc .meta { color:var(--dim); font-size:11px; }
  .inc .ev { color:var(--amb); margin-top:3px; word-break:break-all; white-space:normal; }
  .item { padding:6px 14px; border-bottom:1px solid var(--line); word-break:break-all; }
  .item .ip { color:var(--red); } .item .rx { color:var(--cyan); }
  .item .why { color:var(--dim); font-size:11px; }
  .empty { color:var(--dim); padding:14px; }
</style>
</head>
<body>
<header>
  <h1>🛡 BREACH&nbsp;AGENT · SOC</h1><span class="live" id="live">live</span>
  <div class="stats">
    <div class="stat"><b id="s-req">0</b><span>requests</span></div>
    <div class="stat red"><b id="s-blk">0</b><span>blocked</span></div>
    <div class="stat amb"><b id="s-ban">0</b><span>IPs banned</span></div>
    <div class="stat cyan"><b id="s-waf">0</b><span>WAF rules</span></div>
  </div>
</header>
<main>
  <div class="col">
    <div class="box feed"><h2>Live request feed</h2><div class="body" id="feed"></div></div>
  </div>
  <div class="col">
    <div class="box incidents"><h2>Incidents</h2><div class="body" id="inc"></div></div>
    <div class="box defenses"><h2>Active defenses</h2><div class="body" id="def"></div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function tick() {
  let d;
  try { d = await (await fetch("/__state")).json(); $("live").textContent = "live"; $("live").style.color = "var(--grn)"; }
  catch { $("live").textContent = "disconnected"; $("live").style.color = "var(--red)"; return; }

  const ev = d.events || [];
  $("s-req").textContent = ev.length;
  $("s-blk").textContent = ev.filter(e => e.blocked).length;
  $("s-ban").textContent = (d.denylist || []).length;
  $("s-waf").textContent = (d.rules || []).length;

  $("feed").innerHTML = ev.slice(0, 120).map(e => {
    const cls = e.blocked ? "blocked" : (e.matched ? "attack" : "");
    const q = e.query ? "?" + esc(e.query) : "";
    const flag = e.blocked ? "🛑 " : "";
    return `<div class="row ${cls}"><span class="tag b${e.status}">${e.status}</span>`
         + `<span class="code">${esc(e.ip)}</span> ${flag}${esc(e.method)} ${esc(e.path)}${q}</div>`;
  }).join("") || '<div class="empty">no traffic yet</div>';

  $("inc").innerHTML = (d.incidents || []).map(i =>
    `<div class="inc"><div class="t"><span class="sev">${esc(i.severity)}</span>${esc(i.attack_type)} · ${esc(i.source_ip)}</div>`
    + `<div class="meta">${esc(i.ts)} — ${esc(i.summary)}</div>`
    + `<div class="ev">${esc(i.evidence)}</div></div>`
  ).join("") || '<div class="empty">no incidents — all clear</div>';

  const bans = (d.denylist || []).map(b =>
    `<div class="item"><span class="ip">⛔ ${esc(b.ip)}</span> <span class="why">${esc(b.reason)}</span></div>`).join("");
  const rules = (d.rules || []).map(r =>
    `<div class="item"><span class="rx">🧩 /${esc(r.pattern)}/</span> <span class="why">${esc(r.description)}</span></div>`).join("");
  $("def").innerHTML = (bans + rules) || '<div class="empty">no defenses deployed</div>';
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
